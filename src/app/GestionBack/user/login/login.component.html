<div class="container-scroller">
  <div class="container-fluid page-body-wrapper full-page-wrapper">
    <div class="content-wrapper d-flex align-items-center auth">
      <div class="row flex-grow">
        <div class="col-lg-4 mx-auto">
          <div class="auth-form-light text-left p-5">
            <div class="brand-logo">
              <img src="assets/Back/images/logo.svg">
            </div>
            <h4>Welcome Back!</h4>
            <h6 class="font-weight-light">Sign in to continue</h6>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="pt-3">
              <div class="form-group">
                <input formControlName="email" type="email" class="form-control form-control-lg" placeholder="Email" required />
              </div>
              <div class="form-group">
                <input formControlName="password" type="password" class="form-control form-control-lg" placeholder="Mot de passe" required />
              </div>
              <div class="mt-3 d-grid gap-2">
                <button type="submit" class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn">SIGN IN</button>
              </div>
              <p *ngIf="successMessage" class="text-success text-center mt-2">{{ successMessage }}</p>

              <p *ngIf="errorMessage" class="text-danger text-center mt-2">{{ errorMessage }}</p>
              <div class="text-center mt-4 font-weight-light">
                Don't have an account? <a href="register.html" class="text-primary">Sign Up</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
