<div class="container-scroller">
  <div class="container-fluid page-body-wrapper full-page-wrapper">
    <div class="content-wrapper d-flex align-items-center auth">
      <div class="row flex-grow">
        <div class="col-lg-4 mx-auto">
          <div class="auth-form-light text-left p-5">
            <div class="brand-logo">
              <img src="assets/Back/images/logo.svg">
            </div>
            <h4>New here?</h4>
            <h6 class="font-weight-light">Signing up is easy. It only takes a few steps</h6>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="pt-3">
              <div class="form-group">
                <input formControlName="cin" class="form-control form-control-lg" placeholder="CIN" required />
              </div>
              <div class="form-group">
                <input formControlName="nom" class="form-control form-control-lg" placeholder="Nom" required />
              </div>
              <div class="form-group">
                <input formControlName="prenom" class="form-control form-control-lg" placeholder="Prénom" required />
              </div>
              <div class="form-group">
                <input formControlName="adresse" class="form-control form-control-lg" placeholder="Adresse" required />
              </div>
              <div class="form-group">
                <input formControlName="email" type="email" class="form-control form-control-lg" placeholder="Email" required />
              </div>
              <div class="form-group">
                <label>
                  <input type="checkbox" (change)="onRoleChange($event, 'AGENT')" /> Agent
                </label>
                <label>
                  <input type="checkbox" (change)="onRoleChange($event, 'ADMIN')" /> Admin
                </label>
              </div>
              <div class="form-group">
                <input formControlName="password" type="password" class="form-control form-control-lg" placeholder="Mot de passe" required />
              </div>
              <div class="mb-4">
                <div class="form-check">
                  <label class="form-check-label text-muted">
                    <input type="checkbox" class="form-check-input"> I agree to all Terms & Conditions </label>
                </div>
              </div>
              <div class="mt-3 d-grid gap-2">
                <button type="submit" class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn">SIGN UP</button>
              </div>
              <div class="text-center mt-4 font-weight-light"> Already have an account? <a href="login.html" class="text-primary">Login</a>
              </div>
            </form>
            <p *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</p>
          </div>
        </div>
      </div>
    </div>
    <!-- content-wrapper ends -->
  </div>
  <!-- page-body-wrapper ends -->
</div>
<!-- container-scroller -->
<!-- plugins:js -->
